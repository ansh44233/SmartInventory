services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       smartinventory
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartinventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smartinventory
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    command: python pipeline/seed.py
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smartinventory
    depends_on:
      db:
        condition: service_healthy
    # runs once and exits — not a long-running service
    restart: "no"

volumes:
  postgres_data:
